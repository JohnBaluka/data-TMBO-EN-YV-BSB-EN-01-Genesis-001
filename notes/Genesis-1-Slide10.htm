<p><span id="s10l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">22</span> Then God blessed them and said, “Be fruitful and multiply and fill the waters of the seas, and let birds multiply on the earth.”</span></p><p><span id="s10l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">23</span> And there was evening, and there was morning — the fifth day.</span></p>
