<p><span id="s4l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">6</span> And God said, “Let there be an expanse between the waters, to separate the waters from the waters.”</span></p><p><span id="s4l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">7</span> So God made the expanse and separated the waters beneath it from the waters above. And it was so.</span></p><p><span id="s4l3" class="note-line" data-line="3" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">8</span> God called the expanse “sky.” And there was evening, and there was morning — the second day.</span></p>
