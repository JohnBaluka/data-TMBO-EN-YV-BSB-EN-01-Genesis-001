<p><span id="s2l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">1</span> In the beginning God created the heavens and the earth.</span></p><p><span id="s2l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">2</span> Now the earth was formless and void, and darkness was over the surface of the deep. And the Spirit of God was hovering over the surface of the waters.</span></p>
