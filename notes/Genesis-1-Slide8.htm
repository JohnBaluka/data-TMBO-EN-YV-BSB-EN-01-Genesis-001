<p><span id="s8l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">17</span> God set these lights in the expanse of the sky to shine upon the earth,</span></p><p><span id="s8l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">18</span> to preside over the day and the night, and to separate the light from the darkness. And God saw that it was good.</span></p><p><span id="s8l3" class="note-line" data-line="3" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">19</span> And there was evening, and there was morning — the fourth day.</span></p>
