e="28" transform="translate(62 116)" id="TextBox_17--Slide3--18">In the beginning God created the heavens</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_18--Slide3--19">and the earth.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 197)" id="TextBox_19--Slide3--20" class="fragment-off" data-fragment-index="1">2</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 206)" id="TextBox_20--Slide3--21" class="fragment-off" data-fragment-index="1">Now the earth was formless and void, and darkness</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 244)" id="TextBox_21--Slide3--22" class="fragment-off" data-fragment-index="1">was over the surface of the deep. And the Spirit</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_22--Slide3--23" class="fragment-off" data-fragment-index="1">of God was hovering over the surface of the waters.</text><a id="Narration_Slide3--Slide3--24__LINK" href=""><g clip-path="url(#clip0--Narration_Slide3--Slide3--24)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide3--Slide3--24" style="display:none;"><g clip-path="url(#clip2--Narration_Slide3--Slide3--24)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide3--Slide3--24" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide3--25" /></g></svg>