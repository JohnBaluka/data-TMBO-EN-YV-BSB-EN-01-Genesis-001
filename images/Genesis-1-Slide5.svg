ze="28" transform="translate(62 116)" id="TextBox_17--Slide6--18">And God said, “Let the waters under the sky be</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_18--Slide6--19">gathered into one place, so that the dry land may</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 192)" id="TextBox_19--Slide6--20">appear.” And it was so.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 235)" id="TextBox_20--Slide6--21" class="fragment-off" data-fragment-index="1">10</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 244)" id="TextBox_21--Slide6--22" class="fragment-off" data-fragment-index="1">God called the dry land “earth,” and the gathering</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_22--Slide6--23" class="fragment-off" data-fragment-index="1">of waters He called “seas.” And God saw that it</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 320)" id="TextBox_23--Slide6--24" class="fragment-off" data-fragment-index="1">was good.</text><a id="Narration_Slide6--Slide6--25__LINK" href=""><g clip-path="url(#clip0--Narration_Slide6--Slide6--25)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide6--Slide6--25" style="display:none;"><g clip-path="url(#clip2--Narration_Slide6--Slide6--25)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide6--Slide6--25" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide6--26" /></g></svg>