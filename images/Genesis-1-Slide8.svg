Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 116)" id="TextBox_26--Slide9--27">God set these lights in the expanse of the sky to</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_27--Slide9--28">shine upon the earth,</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 197)" id="TextBox_28--Slide9--29" class="fragment-off" data-fragment-index="1">18</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 206)" id="TextBox_29--Slide9--30" class="fragment-off" data-fragment-index="1">to preside over the day and the night, and to</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 244)" id="TextBox_30--Slide9--31" class="fragment-off" data-fragment-index="1">separate the light from the darkness. And God saw</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_31--Slide9--32" class="fragment-off" data-fragment-index="1">that it was good.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 325)" id="TextBox_32--Slide9--33" class="fragment-off" data-fragment-index="2">19</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 334)" id="TextBox_33--Slide9--34" class="fragment-off" data-fragment-index="2">And there was evening, and there was morning</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(604.373 334)" id="TextBox_33--Slide9--35" class="fragment-off" data-fragment-index="2">—</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 372)" id="TextBox_34--Slide9--36" class="fragment-off" data-fragment-index="2">the fourth day.</text><a id="Narration_Slide9--Slide9--37__LINK" href=""><g clip-path="url(#clip0--Narration_Slide9--Slide9--37)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide9--Slide9--37" style="display:none;"><g clip-path="url(#clip2--Narration_Slide9--Slide9--37)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide9--Slide9--37" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide9--38" /></g></svg>