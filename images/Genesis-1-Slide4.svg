nt-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_24--Slide5--25">waters, to separate the waters from the waters.”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 197)" id="TextBox_25--Slide5--26" class="fragment-off" data-fragment-index="1">7</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 206)" id="TextBox_26--Slide5--27" class="fragment-off" data-fragment-index="1">So</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(96 206)" id="TextBox_26--Slide5--28" class="fragment-off" data-fragment-index="1">God made the expanse and separated the waters</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 244)" id="TextBox_27--Slide5--29" class="fragment-off" data-fragment-index="1">beneath it from the waters above. And it was so.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 287)" id="TextBox_28--Slide5--30" class="fragment-off" data-fragment-index="2">8</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 296)" id="TextBox_29--Slide5--31" class="fragment-off" data-fragment-index="2">God called the expanse “sky.”</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 334)" id="TextBox_30--Slide5--32" class="fragment-off" data-fragment-index="2">And there was evening, and there was morning</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(604.373 334)" id="TextBox_30--Slide5--33" class="fragment-off" data-fragment-index="2">—</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 372)" id="TextBox_31--Slide5--34" class="fragment-off" data-fragment-index="2">the second day.</text><a id="Narration_Slide5--Slide5--35__LINK" href=""><g clip-path="url(#clip0--Narration_Slide5--Slide5--35)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide5--Slide5--35" style="display:none;"><g clip-path="url(#clip2--Narration_Slide5--Slide5--35)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide5--Slide5--35" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide5--36" /></g></svg>