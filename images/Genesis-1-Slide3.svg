" stroke="#F2C14E" stroke-width="3" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd" id="Straight_Connector_17--Slide4--18" class="fragment-off" data-fragment-index="1" /><text fill="#CFE3F7" font-family="Carlito,sans-serif" font-style="italic" font-weight="400" font-size="34" transform="translate(871.333 609)" id="TextBox_18--Slide4--19" class="fragment-off" data-fragment-index="2">night</text><text fill="#7A5230" font-family="Carlito,sans-serif" font-style="italic" font-weight="400" font-size="34" transform="translate(1096.92 609)" id="TextBox_19--Slide4--20" class="fragment-off" data-fragment-index="2">day</text><path d="M1150.5 160.5C1150.5 143.932 1163.93 130.5 1180.5 130.5 1197.07 130.5 1210.5 143.932 1210.5 160.5 1210.5 177.069 1197.07 190.5 1180.5 190.5 1163.93 190.5 1150.5 177.069 1150.5 160.5Z" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-miterlimit="10" fill="#8064A2" fill-rule="evenodd" id="Oval_20--Slide4--21" class="fragment-off" data-fragment-index="2" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="32" transform="translate(1171.92 170)" id="TextBox_21--Slide4--22" class="fragment-off" data-fragment-index="2">1</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 107)" id="TextBox_22--Slide4--23">3</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 116)" id="TextBox_23--Slide4--24">And God said, “Let there be light,”</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_24--Slide4--25">and there was light.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 197)" id="TextBox_25--Slide4--26" class="fragment-off" data-fragment-index="1">4</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 206)" id="TextBox_26--Slide4--27" class="fragment-off" data-fragment-index="1">And God saw that the light was good, and He separated</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 244)" id="TextBox_27--Slide4--28" class="fragment-off" data-fragment-index="1">the light from the darkness.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 287)" id="TextBox_28--Slide4--29" class="fragment-off" data-fragment-index="2">5</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 296)" id="TextBox_29--Slide4--30" class="fragment-off" data-fragment-index="2">God called the light “day,” and the darkness</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 334)" id="TextBox_30--Slide4--31" class="fragment-off" data-fragment-index="2">He called “night.”</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 372)" id="TextBox_31--Slide4--32" class="fragment-off" data-fragment-index="2">And there was evening, and there was morning</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(604.373 372)" id="TextBox_31--Slide4--33" class="fragment-off" data-fragment-index="2">—</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 410)" id="TextBox_32--Slide4--34" class="fragment-off" data-fragment-index="2">the first day.</text><a id="Narration_Slide4--Slide4--35__LINK" href=""><g clip-path="url(#clip0--Narration_Slide4--Slide4--35)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide4--Slide4--35" style="display:none;"><g clip-path="url(#clip2--Narration_Slide4--Slid