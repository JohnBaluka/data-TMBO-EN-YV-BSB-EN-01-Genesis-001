ize="28" transform="translate(250.073 154)" id="TextBox_35--Slide7--37">-</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(258.573 154)" id="TextBox_35--Slide7--38">bearing plants and fruit trees,</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 192)" id="TextBox_36--Slide7--39">each bearing fruit with seed according to its kind.”</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 230)" id="TextBox_37--Slide7--40">And it was so.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 273)" id="TextBox_38--Slide7--41" class="fragment-off" data-fragment-index="1">12</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_39--Slide7--42" class="fragment-off" data-fragment-index="1">The earth produced vegetation: seed</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(481.287 282)" id="TextBox_39--Slide7--43" class="fragment-off" data-fragment-index="1">-</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(489.787 282)" id="TextBox_39--Slide7--44" class="fragment-off" data-fragment-index="1">bearing plants</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 320)" id="TextBox_40--Slide7--45" class="fragment-off" data-fragment-index="1">according to their kinds and trees bearing fruit</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 358)" id="TextBox_41--Slide7--46" class="fragment-off" data-fragment-index="1">with seed according to their kinds. And God saw</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 396)" id="TextBox_42--Slide7--47" class="fragment-off" data-fragment-index="1">that it was good.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 439)" id="TextBox_43--Slide7--48" class="fragment-off" data-fragment-index="2">13</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 448)" id="TextBox_44--Slide7--49" class="fragment-off" data-fragment-index="2">And there was evening, and there was morning</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(604.373 448)" id="TextBox_44--Slide7--50" class="fragment-off" data-fragment-index="2">—</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 486)" id="TextBox_45--Slide7--51" class="fragment-off" data-fragment-index="2">the third day.</text><a id="Narration_Slide7--Slide7--52__LINK" href=""><g clip-path="url(#clip0--Narration_Slide7--Slide7--52)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide7--Slide7--52" style="display:none;"><g clip-path="url(#clip2--Narration_Slide7--Slide7--52)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide7--Slide7--52" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide7--53" /></g></svg>