 fill-rule="evenodd" id="Oval_31--Slide8--32" class="fragment-off" data-fragment-index="2" /><path d="M1012 130.5C1012 129.119 1013.12 128 1014.5 128 1015.88 128 1017 129.119 1017 130.5 1017 131.881 1015.88 133 1014.5 133 1013.12 133 1012 131.881 1012 130.5Z" fill="#FFFFFF" fill-rule="evenodd" id="Oval_32--Slide8--33" class="fragment-off" data-fragment-index="2" /><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 107)" id="TextBox_33--Slide8--34">14</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 116)" id="TextBox_34--Slide8--35">And God said, “Let there be lights in the expanse</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_35--Slide8--36">of the sky to distinguish between the day and the</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 192)" id="TextBox_36--Slide8--37">night, and let them be signs to mark the seasons</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 230)" id="TextBox_37--Slide8--38">and days and years.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 273)" id="TextBox_38--Slide8--39" class="fragment-off" data-fragment-index="1">15</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_39--Slide8--40" class="fragment-off" data-fragment-index="1">And let them serve as lights in the expanse of the</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 320)" id="TextBox_40--Slide8--41" class="fragment-off" data-fragment-index="1">sky to shine upon the earth.” And it was so.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 363)" id="TextBox_41--Slide8--42" class="fragment-off" data-fragment-index="2">16</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 372)" id="TextBox_42--Slide8--43" class="fragment-off" data-fragment-index="2">God made two great lights: the greater light to rule</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 410)" id="TextBox_43--Slide8--44" class="fragment-off" data-fragment-index="2">the day and the lesser light to rule the night. And</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 448)" id="TextBox_44--Slide8--45" class="fragment-off" data-fragment-index="2">He made the stars as well.</text><a id="Narration_Slide8--Slide8--46__LINK" href=""><g clip-path="url(#clip0--Narration_Slide8--Slide8--46)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide8--Slide8--46" style="display:none;"><g clip-path="url(#clip2--Narration_Slide8--Slide8--46)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide8--Slide8--46" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide8--47" /></g></svg>