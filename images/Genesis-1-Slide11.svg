26--Slide12--27" class="fragment-off" data-fragment-index="1" /><path d="M902 600C902 595.582 905.582 592 910 592 914.418 592 918 595.582 918 600 918 604.418 914.418 608 910 608 905.582 608 902 604.418 902 600Z" fill="#2F6B2F" fill-rule="evenodd" id="Oval_27--Slide12--28" class="fragment-off" data-fragment-index="1" /><path d="M917 600C917 595.582 920.582 592 925 592 929.418 592 933 595.582 933 600 933 604.418 929.418 608 925 608 920.582 608 917 604.418 917 600Z" fill="#2F6B2F" fill-rule="evenodd" id="Oval_28--Slide12--29" class="fragment-off" data-fragment-index="1" /><path d="M930 598C930 593.029 934.029 589 939 589 943.971 589 948 593.029 948 598 948 602.971 943.971 607 939 607 934.029 607 930 602.971 930 598Z" fill="#2F6B2F" fill-rule="evenodd" id="Oval_29--Slide12--30" class="fragment-off" data-fragment-index="1" /><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 107)" id="TextBox_30--Slide12--31">24</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 116)" id="TextBox_31--Slide12--32">And God said, “Let the earth bring forth living</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_32--Slide12--33">creatures according to their kinds: livestock, land</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 192)" id="TextBox_33--Slide12--34">crawlers, and beasts of the earth according to</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(586.887 192)" id="TextBox_33--Slide12--35">their</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 230)" id="TextBox_34--Slide12--36">kinds.” And it was so.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 273)" id="TextBox_35--Slide12--37" class="fragment-off" data-fragment-index="1">25</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_36--Slide12--38" class="fragment-off" data-fragment-index="1">God made the beasts of the earth according to</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(597.967 282)" id="TextBox_36--Slide12--39" class="fragment-off" data-fragment-index="1">their</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 320)" id="TextBox_37--Slide12--40" class="fragment-off" data-fragment-index="1">kinds, the livestock according to their kinds, and</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 358)" id="TextBox_38--Slide12--41" class="fragment-off" data-fragment-index="1">everything that crawls upon the earth according to</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 396)" id="TextBox_39--Slide12--42" class="fragment-off" data-fragment-index="1">its kind. And God saw that it was good.</text><a id="Narration_Slide12--Slide12--43__LINK" href=""><g clip-path="url(#clip0--Narration_Slide12--Slide12--43)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide12--Slide12--43" style="display:none;"><g clip-path="url(#clip2--Narration_Slide12--Slide12--43)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide12--Slide12--43" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide12--44" /></g></svg>