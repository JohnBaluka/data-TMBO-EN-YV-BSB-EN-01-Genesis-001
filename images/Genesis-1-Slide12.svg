07 1078 436 1078 446.493 1069.49 455 1059 455 1048.51 455 1040 446.493 1040 436Z" fill="#C68A5A" fill-rule="evenodd" id="Oval_25--Slide13--26" class="fragment-off" data-fragment-index="1" /><path d="M1035 471C1035 462.163 1042.16 455 1051 455L1067 455C1075.84 455 1083 462.163 1083 471L1083 544C1083 552.837 1075.84 560 1067 560L1051 560C1042.16 560 1035 552.837 1035 544Z" fill="#B5654A" fill-rule="evenodd" id="Rectangle:_Rounded_Corners_26--Slide13--27" class="fragment-off" data-fragment-index="1" /><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 107)" id="TextBox_27--Slide13--28">26</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 116)" id="TextBox_28--Slide13--29">Then God said, “Let Us make man in Our image, after</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_29--Slide13--30">Our likeness, to rule over the fish of the sea and</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 192)" id="TextBox_30--Slide13--31">the birds of the air, over the livestock, and over</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 230)" id="TextBox_31--Slide13--32">all the earth itself and every creature that crawls</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 268)" id="TextBox_32--Slide13--33">upon it.”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 311)" id="TextBox_33--Slide13--34" class="fragment-off" data-fragment-index="1">27</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 320)" id="TextBox_34--Slide13--35" class="fragment-off" data-fragment-index="1">So</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(96 320)" id="TextBox_34--Slide13--36" class="fragment-off" data-fragment-index="1">God created man in His own image;</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(92 358)" id="TextBox_35--Slide13--37" class="fragment-off" data-fragment-index="1">in the image of</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(268.933 358)" id="TextBox_35--Slide13--38" class="fragment-off" data-fragment-index="1">God</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(322.433 358)" id="TextBox_35--Slide13--39" class="fragment-off" data-fragment-index="1">He created him;</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(92 396)" id="TextBox_36--Slide13--40" class="fragment-off" data-fragment-index="1">male and</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(203.5 396)" id="TextBox_36--Slide13--41" class="fragment-off" data-fragment-index="1">female</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(287.8 396)" id="TextBox_36--Slide13--42" class="fragment-off" data-fragment-index="1">He created them.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 439)" id="TextBox_37--Slide13--43" class="fragment-off" data-fragment-index="2">28</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 448)" id="TextBox_38--Slide13--44" class="fragment-off" data-fragment-index="2">God blessed them and said to them, “Be fruitful and</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 486)" id="TextBox_39--Slide13--45" class="fragment-off" data-fragment-index="2">multiply, and fill the earth and subdue it; rule over</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 524)" id="TextBox_40--Slide13--46" class="fragment-off" data-fragment-index="2">the fish of the sea and the birds of the air and</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 562)" id="TextBox_41--Slide13--47" class="fragment-off" data-fragment-index="2">every creature that crawls upon the earth.”</text><a id="Narration_Slide13--Slide13--48__LINK" href=""><g clip-path="url(#clip0--Narration_Slide13--Slide13--48)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide13--Slide13--48" style="display:none;"><g clip-path="url(#clip2--Narration_Slide13--Slide13--48)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide13--Slide13--48" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide13--49" /></g></svg>