206)" id="TextBox_40--Slide15--42" class="fragment-off" data-fragment-index="1">And by the seventh day God had finished the work He</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 244)" id="TextBox_41--Slide15--43" class="fragment-off" data-fragment-index="1">had been doing;</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(252.333 244)" id="TextBox_41--Slide15--44" class="fragment-off" data-fragment-index="1">so</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(284.5 244)" id="TextBox_41--Slide15--45" class="fragment-off" data-fragment-index="1">on that day He rested from all</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_42--Slide15--46" class="fragment-off" data-fragment-index="1">His work.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 325)" id="TextBox_43--Slide15--47" class="fragment-off" data-fragment-index="2">3</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 334)" id="TextBox_44--Slide15--48" class="fragment-off" data-fragment-index="2">Then God blessed the seventh day and sanctified it,</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 372)" id="TextBox_45--Slide15--49" class="fragment-off" data-fragment-index="2">because on that day He rested from all the work of</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 410)" id="TextBox_46--Slide15--50" class="fragment-off" data-fragment-index="2">creation that He had accomplished.</text><a id="Narration_Slide15--Slide15--51__LINK" href=""><g clip-path="url(#clip0-