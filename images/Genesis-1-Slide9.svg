ate(62 116)" id="TextBox_34--Slide10--35">And God said, “Let the waters teem with living</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_35--Slide10--36">creatures, and let birds fly above the earth in the</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 192)" id="TextBox_36--Slide10--37">open expanse of the sky.”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 235)" id="TextBox_37--Slide10--38" class="fragment-off" data-fragment-index="1">21</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 244)" id="TextBox_38--Slide10--39" class="fragment-off" data-fragment-index="1">So</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(96 244)" id="TextBox_38--Slide10--40" class="fragment-off" data-fragment-index="1">God created the great sea creatures and every</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_39--Slide10--41" class="fragment-off" data-fragment-index="1">living thing that moves, with which the waters</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 320)" id="TextBox_40--Slide10--42" class="fragment-off" data-fragment-index="1">teemed according to their kinds, and every winged</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 358)" id="TextBox_41--Slide10--43" class="fragment-off" data-fragment-index="1">bird after its kind. And God saw that it was good.</text><a id="Narration_Slide10--Slide10--44__LINK" href=""><g clip-path="url(#clip0--Narration_Slide10--Slide10--44)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide10--Slide10--44" style="display:none;"><g clip-path="url(#clip2--Narration_Slide10--Slide10--44)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide10--Slide10--44" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide10--45" /></g></svg>