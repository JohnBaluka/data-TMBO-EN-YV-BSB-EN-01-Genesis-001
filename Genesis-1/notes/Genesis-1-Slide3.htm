<p><span id="s3l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">3</span> And God said, “Let there be light,” and there was light.</span></p><p><span id="s3l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">4</span> And God saw that the light was good, and He separated the light from the darkness.</span></p><p><span id="s3l3" class="note-line" data-line="3" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">5</span> God called the light “day,” and the darkness He called “night.” And there was evening, and there was morning — the first day.</span></p>
