<p><span id="s5l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">9</span> And God said, “Let the waters under the sky be gathered into one place, so that the dry land may appear.” And it was so.</span></p><p><span id="s5l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">10</span> God called the dry land “earth,” and the gathering of waters He called “seas.” And God saw that it was good.</span></p>
