="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd" transform="matrix(1 0 0 -1 1092.5 210.5)" id="Straight_Connector_26--Slide14--27" class="fragment-off" data-fragment-index="1" /><path d="M873 610C873 606.134 876.134 603 880 603 883.866 603 887 606.134 887 610 887 613.866 883.866 617 880 617 876.134 617 873 613.866 873 610Z" fill="#2F6B2F" fill-rule="evenodd" id="Oval_27--Slide14--28" class="fragment-off" data-fragment-index="1" /><path d="M888 610C888 606.134 891.134 603 895 603 898.866 603 902 606.134 902 610 902 613.866 898.866 617 895 617 891.134 617 888 613.866 888 610Z" fill="#2F6B2F" fill-rule="evenodd" id="Oval_28--Slide14--29" class="fragment-off" data-fragment-index="1" /><path d="M903 610C903 606.134 906.134 603 910 603 913.866 603 917 606.134 917 610 917 613.866 913.866 617 910 617 906.134 617 903 613.866 903 610Z" fill="#2F6B2F" fill-rule="evenodd" id="Oval_29--Slide14--30" class="fragment-off" data-fragment-index="1" /><path d="M916 608C916 603.582 919.582 600 924 600 928.418 600 932 603.582 932 608 932 612.418 928.418 616 924 616 919.582 616 916 612.418 916 608Z" fill="#2F6B2F" fill-rule="evenodd" id="Oval_30--Slide14--31" class="fragment-off" data-fragment-index="1" /><rect x="800" y="110" width="430" height="540" fill="#FFE08A" fill-opacity="0.180392" id="Rectangle_31--Slide14--32" class="fragment-off" data-fragment-index="2" /><path d="M1150.5 160.5C1150.5 143.932 1163.93 130.5 1180.5 130.5 1197.07 130.5 1210.5 143.932 1210.5 160.5 1210.5 177.069 1197.07 190.5 1180.5 190.5 1163.93 190.5 1150.5 177.069 1150.5 160.5Z" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-miterlimit="10" fill="#8064A2" fill-rule="evenodd" id="Oval_32--Slide14--33" class="fragment-off" data-fragment-index="2" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="32" transform="translate(1171.92 170)" id="TextBox_33--Slide14--34" class="fragment-off" data-fragment-index="2">6</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 107)" id="TextBox_34--Slide14--35">29</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 116)" id="TextBox_35--Slide14--36">Then God said, “Behold, I have given you every</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 154)" id="TextBox_36--Slide14--37">seed</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(115.667 154)" id="TextBox_36--Slide14--38">-</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(124.167 154)" id="TextBox_36--Slide14--39">bearing plant on the face of all the earth, and</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 192)" id="TextBox_37--Slide14--40">every tree whose fruit contains seed. They will be</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 230)" id="TextBox_38--Slide14--41">yours for food.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 273)" id="TextBox_39--Slide14--42" class="fragment-off" data-fragment-index="1">30</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 282)" id="TextBox_40--Slide14--43" class="fragment-off" data-fragment-index="1">And to every beast of the earth and every bird of</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 320)" id="TextBox_41--Slide14--44" class="fragment-off" data-fragment-index="1">the air and every creature that crawls upon the</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 358)" id="TextBox_42--Slide14--45" class="fragment-off" data-fragment-index="1">earth</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(129.5 358)" id="TextBox_42--Slide14--46" class="fragment-off" data-fragment-index="1">—</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(161.167 358)" id="TextBox_42--Slide14--47" class="fragment-off" data-fragment-index="1">everything that has the breath of life in</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 396)" id="TextBox_43--Slide14--48" class="fragment-off" data-fragment-index="1">it</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(84.1667 396)" id="TextBox_43--Slide14--49" class="fragment-off" data-fragment-index="1">—</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(115.833 396)" id="TextBox_43--Slide14--50" class="fragment-off" data-fragment-index="1">I have given every green plant for food.”</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 434)" id="TextBox_44--Slide14--51" class="fragment-off" data-fragment-index="1">And it was so.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="700" font-size="18" transform="translate(32 477)" id="TextBox_45--Slide14--52" class="fragment-off" data-fragment-index="2">31</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 486)" id="TextBox_46--Slide14--53" class="fragment-off" data-fragment-index="2">And God looked upon all that He had made, and</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 524)" id="TextBox_47--Slide14--54" class="fragment-off" data-fragment-index="2">indeed, it was very good.</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 562)" id="TextBox_48--Slide14--55" class="fragment-off" data-fragment-index="2">And there was evening, and there was morning</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(604.373 562)" id="TextBox_48--Slide14--56" class="fragment-off" data-fragment-index="2">—</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(62 600)" id="TextBox_49--Slide14--57" class="fragment-off" data-fragment-index="2">the sixth day.</text><a id="Narration_Slide14--Slide14--58__LINK" href=""><g clip-path="url(#clip0--Narration_Slide14--Slide14--58)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide14--Slide14--58" style="display:none;"><g clip-path="url(#clip2--Narration_Slide14--Slide14--58)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide14--Slide14--58" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="769.5" y="78.5001" width="490" height="608" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide14--59" /></g></svg>